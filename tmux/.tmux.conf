# prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# terminal: true color, italics (tmux-256color ships with macOS)
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB'

# pass modified keys like <C-.> (sidekick.nvim) and images (snacks.nvim) through to nvim
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'
set -g allow-passthrough on

# copy to the system clipboard via the terminal (OSC 52)
set -g set-clipboard on

set -g mouse on
set -g focus-events on
set -sg escape-time 0
set -g set-titles on
set -g history-limit 100000

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity off

# start windows and panes at 1, renumber after closing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows 1

# ---------------------------------------------------------------------------
# keys
# ---------------------------------------------------------------------------

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

bind c new-window -c "#{pane_current_path}"
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

# navigate panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

# resize panes
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind C-h previous-window
bind C-l next-window

# ---------------------------------------------------------------------------
# plugins (tpm: prefix + I to install, prefix + U to update)
# ---------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'robhurring/tmux-uptime'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

set -g @mode_indicator_prefix_mode_style 'bg=yellow,fg=black'
set -g @mode_indicator_copy_mode_style 'bg=#f3e70f,fg=#262335'
set -g @mode_indicator_sync_mode_style 'bg=#fe4450,fg=#262335'
set -g @mode_indicator_empty_mode_style 'bg=color9,fg=white'

# ---------------------------------------------------------------------------
# look
# ---------------------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style bg=default,fg=cyan

set -g status-left-style bg=default,fg=cyan
set -g status-left-length 100
set -g status-left "#[fg=#ff7edb] #S #[fg=#ff7edb]»#[fg=brightblue] #[fg=cyan]#P#[fg=colour247]/#{window_panes} #[fg=#ff7edb]» #[fg=colour241]↑:#[fg=colour245] #{uptime} #[fg=#ff7edb]»"

# IP addresses (en0 bare, others labelled) and clock
set -g status-right-style bg=default,fg=cyan
set -g status-right-length 100
set -g status-right "#[fg=#ff7edb]« #[fg=brightblue]#(ifconfig en0 | awk '/inet /{print $2}')#(ifconfig en1 2>/dev/null | awk '/inet /{print \" en1:\"$2}')#(ifconfig en3 2>/dev/null | awk '/inet /{print \" en3:\"$2}')#(ifconfig tun0 2>/dev/null | awk '/inet /{print \" vpn:\"$2}') #[fg=#ff7edb]« #[fg=colour245]%H:%M #{tmux_mode_indicator}"

set -g window-status-format " #[fg=colour244]#I:#W #F "
set -g window-status-current-format " #[fg=colour51]#I:#[fg=white]#[bold]#W #[fg=colour51]#F "
set -g window-status-current-style bg=default,fg=black
set -g window-status-activity-style bg=black,fg=#ff7edb
set -g window-status-separator ""

set -g pane-border-style bg=default,fg=colour241
set -g pane-active-border-style bg=default,fg=#ff7edb

set -g display-panes-time 2000
set -g display-panes-colour default
set -g display-panes-active-colour default

set -g clock-mode-colour colour206
set -g clock-mode-style 24

set -g message-style bg=color9,fg=white
set -g message-command-style bg=default,fg=default

# keep this line at the very bottom
run -b '~/.tmux/plugins/tpm/tpm'
